name: Release integrations

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Require the tag to match the manifest version
        run: test "$GITHUB_REF_NAME" = "v$(node -p \"require('./package.json').version\")"
      - run: npm run build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
